<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Price Recommendation System</title>
    <link rel="stylesheet" href="/static/styles.css">
</head>
<body>
    <div class="container">
        <!-- Authentication Section -->
        <div id="authSection">
            <h1>🔐 Login to Price Recommendation System</h1>

            <!-- Login Form -->
            <div id="loginForm">
                <h2>Login</h2>
                <form id="loginFormElement">
                    <div class="form-group">
                        <label for="loginEmail">Email:</label>
                        <input type="email" id="loginEmail" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="loginPassword">Password:</label>
                        <input type="password" id="loginPassword" required placeholder="Enter your password">
                    </div>
                    <button type="submit" id="loginBtn">Login</button>
                </form>
                <p>Don't have an account? <a href="#" id="showRegister">Register here</a></p>
            </div>

            <!-- Register Form -->
            <div id="registerForm" style="display: none;">
                <h2>Register</h2>
                <form id="registerFormElement">
                    <div class="form-group">
                        <label for="registerName">Name:</label>
                        <input type="text" id="registerName" required placeholder="Enter your name">
                    </div>
                    <div class="form-group">
                        <label for="registerEmail">Email:</label>
                        <input type="email" id="registerEmail" required placeholder="Enter your email">
                    </div>
                    <div class="form-group">
                        <label for="registerPassword">Password:</label>
                        <input type="password" id="registerPassword" required placeholder="Enter your password">
                    </div>
                    <div class="form-group">
                        <label for="registerLocation">Location:</label>
                        <input type="text" id="registerLocation" placeholder="Enter your location (optional)">
                    </div>
                    <button type="submit" id="registerBtn">Register</button>
                </form>
                <p>Already have an account? <a href="#" id="showLogin">Login here</a></p>
            </div>
        </div>

        <!-- Main Application Section (hidden until authenticated) -->
        <div id="mainSection" style="display: none;">
            <h1>🌱 Price Recommendation System</h1>
            <div id="userInfo" class="user-info"></div>

            <form id="recommendationForm">
                <div class="form-group">
                    <label for="gardenerId">Gardener ID:</label>
                    <input type="number" id="gardenerId" required placeholder="Enter gardener ID">
                </div>
                <div class="form-group">
                    <label for="location">Location:</label>
                    <input type="text" id="location" required placeholder="Enter location (e.g., New York)">
                </div>
                <button type="submit" id="submitBtn">Get Price Recommendation</button>
                <button type="button" id="logoutBtn" class="logout-btn">Logout</button>
            </form>

            <div id="result" class="result">
                <div id="loading" class="loading">Getting recommendation...</div>
                <div id="response"></div>
            </div>
        </div>
    </div>

    <script src="/static/script.js"></script>
</body>
</html>
