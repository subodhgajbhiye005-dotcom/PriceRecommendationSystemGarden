<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Price Recommendation System</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            padding: 40px;
            text-align: center;
        }

        h1 {
            color: #333;
            margin-bottom: 10px;
        }

        p {
            color: #666;
            margin-bottom: 30px;
            font-size: 14px;
        }

        .tab-group {
            display: flex;
            margin-bottom: 25px;
            border-bottom: 1px solid #ddd;
        }

        .tab {
            flex: 1;
            padding: 10px;
            cursor: pointer;
            color: #666;
            font-weight: 500;
            border-bottom: 2px solid transparent;
            transition: all 0.3s;
        }

        .tab.active {
            color: #764ba2;
            border-bottom-color: #764ba2;
        }

        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #555;
            font-size: 14px;
        }

        .form-group input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        .form-group input:focus {
            outline: none;
            border-color: #764ba2;
        }

        .btn {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s;
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(118, 75, 162, 0.3);
        }

        .btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .verification-group {
            display: none;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #eee;
        }

        .back-link {
            display: block;
            margin-top: 20px;
            color: #666;
            text-decoration: none;
            font-size: 14px;
        }

        .back-link:hover {
            color: #764ba2;
            text-decoration: underline;
        }

        .alert {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-size: 14px;
            display: none;
        }

        .alert-success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .alert-error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Forgot Password</h1>
        <p>Choose a recovery method to reset your password.</p>

        <div id="alert" class="alert"></div>

        <div class="tab-group">
            <div class="tab active" onclick="switchTab('email')">Email</div>
            <div class="tab" onclick="switchTab('mobile')">Mobile Number</div>
        </div>

        <form id="requestForm">
            <div id="emailInput" class="form-group">
                <label for="email">Enter your registered email</label>
                <input type="email" id="email" placeholder="john@example.com">
            </div>

            <div id="mobileInput" class="form-group" style="display: none;">
                <label for="mobile">Enter your mobile number</label>
                <input type="tel" id="mobile" placeholder="1234567890">
            </div>

            <button type="submit" id="sendBtn" class="btn">Send Verification Code</button>
        </form>

        <div id="verificationSection" class="verification-group">
            <form id="verifyForm">
                <div class="form-group">
                    <label for="code">Enter Verification Code</label>
                    <input type="text" id="code" placeholder="Enter 6-digit code" maxlength="6"
                        style="letter-spacing: 5px; text-align: center; font-size: 20px;">
                    <small style="color: #666; display: block; margin-top: 5px;">Code sent to your <span
                            id="sentDestination"></span></small>
                </div>

                <div class="form-group">
                    <label for="newPassword">New Password</label>
                    <input type="password" id="newPassword" placeholder="Minimum 8 characters">
                </div>

                <div class="form-group">
                    <label for="confirmNewPassword">Confirm New Password</label>
                    <input type="password" id="confirmNewPassword" placeholder="Re-enter password">
                </div>

                <button type="submit" class="btn">Reset Password</button>
            </form>
        </div>

        <a href="/login" class="back-link">← Back to Login</a>
    </div>

    <script>
        let currentMethod = 'email';

        function switchTab(method) {
            currentMethod = method;
            document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
            event.target.classList.add('active');

            if (method === 'email') {
                document.getElementById('emailInput').style.display = 'block';
                document.getElementById('mobileInput').style.display = 'none';
            } else {
                document.getElementById('emailInput').style.display = 'none';
                document.getElementById('mobileInput').style.display = 'block';
            }

            // Reset state
            document.getElementById('verificationSection').style.display = 'none';
            document.getElementById('sendBtn').style.display = 'block';
            hideAlert();
        }

        document.getElementById('requestForm').addEventListener('submit', async function (e) {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const mobile = document.getElementById('mobile').value;
            const btn = document.getElementById('sendBtn');

            const value = currentMethod === 'email' ? email : mobile;

            if (!value) {
                showAlert(`Please enter your ${currentMethod}`, 'error');
                return;
            }

            // Simulate sending code
            btn.disabled = true;
            btn.textContent = 'Sending...';

            // Simulate API call delay
            setTimeout(() => {
                btn.disabled = false;
                btn.textContent = 'Send Verification Code';
                btn.style.display = 'none'; // Hide send button

                document.getElementById('verificationSection').style.transform = 'translateY(0)';
                document.getElementById('verificationSection').style.display = 'block';
                document.getElementById('verificationSection').scrollIntoView({ behavior: 'smooth' });
                document.getElementById('sentDestination').textContent = currentMethod === 'email' ? 'email' : 'mobile number';

                showAlert(`Verification code sent to your ${currentMethod}! (Use 123456 for testing)`, 'success');
            }, 1500);
        });

        document.getElementById('verifyForm').addEventListener('submit', function (e) {
            e.preventDefault();
            const code = document.getElementById('code').value;
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmNewPassword').value;

            if (code !== '123456') { // Mock validation
                showAlert('Invalid verification code', 'error');
                return;
            }

            if (newPass.length < 8) {
                showAlert('Password must be at least 8 characters', 'error');
                return;
            }

            if (newPass !== confirmPass) {
                showAlert('Passwords do not match', 'error');
                return;
            }

            // Mock success
            showAlert('Password reset successfully! Redirecting...', 'success');
            setTimeout(() => {
                window.location.href = '/login';
            }, 2000);
        });

        function showAlert(msg, type) {
            const el = document.getElementById('alert');
            el.textContent = msg;
            el.className = `alert alert-${type}`;
            el.style.display = 'block';
        }

        function hideAlert() {
            document.getElementById('alert').style.display = 'none';
        }
    </script>
</body>

</html>
