<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gardener Login - Service Provider Portal</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #43a047 0%, #2e7d32 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 450px;
            position: relative;
        }

        .login-header {
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            padding: 30px 40px;
            text-align: center;
            position: relative;
        }

        .login-header::before {
            content: '🌱';
            font-size: 48px;
            display: block;
            margin-bottom: 10px;
        }

        .login-header h1 {
            font-size: 24px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .login-header p {
            opacity: 0.9;
            font-size: 14px;
        }

        .login-form {
            padding: 40px;
        }

        .form-group {
            margin-bottom: 25px;
            position: relative;
        }

        .form-group input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e1e5e9;
            border-radius: 8px;
            font-size: 16px;
            transition: all 0.3s ease;
            background: #f8f9fa;
        }

        .form-group input:focus {
            outline: none;
            border-color: #2e7d32;
            background: white;
            box-shadow: 0 0 0 3px rgba(46, 125, 50, 0.1);
        }

        .form-group label {
            position: absolute;
            top: 15px;
            left: 20px;
            color: #666;
            transition: all 0.3s ease;
            pointer-events: none;
            background: white;
            padding: 0 5px;
        }

        .form-group input:focus + label,
        .form-group input:not(:placeholder-shown) + label {
            top: -10px;
            font-size: 12px;
            color: #2e7d32;
        }

        .service-badges {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-bottom: 25px;
        }

        .service-badge {
            background: #e8f5e8;
            color: #2e7d32;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid #c8e6c9;
        }

        .login-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #2e7d32 0%, #1b5e20 100%);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-bottom: 20px;
        }

        .login-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(46, 125, 50, 0.3);
        }

        .login-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
            transform: none;
        }

        .features {
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 25px;
        }

        .features h3 {
            color: #2e7d32;
            margin-bottom: 15px;
            font-size: 16px;
        }

        .features ul {
            list-style: none;
            padding: 0;
        }

        .features li {
            color: #666;
            font-size: 14px;
            margin-bottom: 8px;
            padding-left: 20px;
            position: relative;
        }

        .features li::before {
            content: '✓';
            color: #2e7d32;
            font-weight: bold;
            position: absolute;
            left: 0;
        }

        .back-link {
            text-align: center;
            margin-top: 20px;
        }

        .back-link a {
            color: #2e7d32;
            text-decoration: none;
            font-weight: 500;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: #1b5e20;
            text-decoration: underline;
        }

        .alert {
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
        }

        .alert-error {
            background-color: #fee;
            border: 1px solid #fcc;
            color: #c33;
        }

        .alert-success {
            background-color: #efe;
            border: 1px solid #cfc;
            color: #363;
        }

        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #2e7d32;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Mobile responsiveness */
        @media (max-width: 480px) {
            .login-container {
                margin: 20px;
                max-width: none;
            }

            .login-header {
                padding: 20px 30px;
            }

            .login-form {
                padding: 30px 20px;
            }

            .service-badges {
                justify-content: center;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-header">
            <h1>Gardener Portal</h1>
            <p>Manage your gardening services</p>
        </div>

        <div id="alert" class="alert"></div>

        <form class="login-form" id="gardenerLoginForm">
            <div class="service-badges">
                <span class="service-badge">Lawn Care</span>
                <span class="service-badge">Garden Design</span>
                <span class="service-badge">Tree Service</span>
                <span class="service-badge">Maintenance</span>
            </div>

            <div class="features">
                <h3>Portal Features</h3>
                <ul>
                    <li>Manage service bookings</li>
                    <li>Track earnings and payments</li>
                    <li>Update availability schedule</li>
                    <li>View customer reviews</li>
                    <li>Access service analytics</li>
                </ul>
            </div>

            <div class="form-group">
                <input type="email" id="email" placeholder=" " required>
                <label for="email">Professional Email</label>
            </div>

            <div class="form-group">
                <input type="password" id="password" placeholder=" " required>
                <label for="password">Account Password</label>
            </div>

            <button type="submit" class="login-btn" id="loginBtn">
                Access Gardener Dashboard
            </button>

            <div class="back-link">
                <a href="user_login.html">← Back to User Login</a>
            </div>
        </form>
    </div>

    <script>
        // Form handling
        document.getElementById('gardenerLoginForm').addEventListener('submit', async function(e) {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const loginBtn = document.getElementById('loginBtn');

            // Clear previous alerts
            const alertDiv = document.getElementById('alert');
            alertDiv.style.display = 'none';
            alertDiv.className = 'alert';

            // Show loading state
            loginBtn.disabled = true;
            loginBtn.innerHTML = '<span class="loading"></span>Accessing dashboard...';

            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include',
                    body: JSON.stringify({ email, password, userType: 'gardener' })
                });

                const data = await response.json();

                if (response.ok) {
                    // Success - redirect to gardener dashboard
                    showAlert('Welcome back! Redirecting to your dashboard...', 'success');
                    setTimeout(() => {
                        window.location.href = '/gardener_dashboard.html';
                    }, 1000);
                } else {
                    // Error
                    showAlert(data.error || 'Login failed. Please check your credentials.', 'error');
                }
            } catch (error) {
                console.error('Login error:', error);
                showAlert('Network error. Please check your connection and try again.', 'error');
            }

            // Reset button
            loginBtn.disabled = false;
            loginBtn.textContent = 'Access Gardener Dashboard';
        });

        // Alert function
        function showAlert(message, type) {
            const alertDiv = document.getElementById('alert');
            alertDiv.textContent = message;
            alertDiv.className = `alert alert-${type}`;
            alertDiv.style.display = 'block';

            // Auto-hide after 5 seconds for non-error alerts
            if (type !== 'error') {
                setTimeout(() => {
                    alertDiv.style.display = 'none';
                }, 5000);
            }
        }

        // Demo credentials helper
        function showDemoCredentials() {
            const demoInfo = `
                <strong>Gardener Demo Credentials:</strong><br>
                Email: mike@gardener.com<br>
                Password: any password
            `;
            showAlert(demoInfo, 'success');
        }

        // Show demo credentials on page load
        setTimeout(showDemoCredentials, 1000);
    </script>
</body>
</html>
